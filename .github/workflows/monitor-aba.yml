name: ABA PayWay Monitor
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # We restore the hash file from cache so we can compare across runs
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .aba_docs_hash
          key: aba-hash-${{ github.run_id }}
          restore-keys: |
            aba-hash-

      - name: Run monitor script
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npx tsx scripts/monitor-aba.mts
